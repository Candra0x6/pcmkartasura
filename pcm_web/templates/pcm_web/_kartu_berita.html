<article class="card h-100 border-0 shadow-sm">
    {% if berita.gambar_sampul %}
    <a href="{% url 'pcm_web:detail_berita' berita.slug %}" class="text-decoration-none">
        <img src="{{ berita.gambar_sampul.url }}" class="card-img-top" alt="{{ berita.judul }}"
            style="height: 220px; object-fit: cover;">
    </a>
    {% endif %}
    <div class="card-body d-flex flex-column">
        <p class="small text-success mb-2">{{ berita.tanggal_terbit|date:"d M Y" }}</p>
        <h2 class="h5 card-title">
            <a class="text-decoration-none text-dark" href="{% url 'pcm_web:detail_berita' berita.slug %}">
                {{ berita.judul }}
            </a>
        </h2>
        <p class="card-text text-secondary">{{ berita.ringkasan|truncatewords:28 }}</p>
        <a href="{% url 'pcm_web:detail_berita' berita.slug %}" class="btn btn-outline-success mt-auto align-self-start">
            Baca selengkapnya
        </a>
    </div>
</article>
